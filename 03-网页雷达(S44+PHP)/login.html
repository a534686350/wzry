<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡密登录 - 游戏雷达</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0a0e27 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e0e0e0;
            padding: 20px;
        }
        .login-box {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(135deg, rgba(47, 54, 60, 0.95) 0%, rgba(26, 31, 36, 0.95) 100%);
            border: 1px solid rgba(74, 158, 255, 0.2);
            border-radius: 16px;
            padding: 40px 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .login-box h1 {
            text-align: center;
            color: #4a9eff;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .login-box p.subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 14px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(74, 158, 255, 0.3);
            border-radius: 10px;
            background: rgba(10, 14, 18, 0.8);
            color: #fff;
            font-size: 16px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #4a9eff;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4a9eff 0%, #3a7fd5 100%);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(74, 158, 255, 0.4); }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .message {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            display: none;
        }
        .message.error { background: rgba(255, 68, 68, 0.15); border: 1px solid rgba(255, 68, 68, 0.4); color: #ff6b6b; display: block; }
        .message.success { background: rgba(22, 183, 119, 0.15); border: 1px solid rgba(22, 183, 119, 0.4); color: #16b777; display: block; }
        .hint { margin-top: 20px; text-align: center; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>游戏雷达</h1>
        <p class="subtitle">请输入卡密登录</p>
        <form id="loginForm">
            <label for="cardKey">卡密</label>
            <input type="text" id="cardKey" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off" required />
            <button type="submit" id="loginBtn">登 录</button>
        </form>
        <div id="message" class="message"></div>
        <p class="hint">卡密首次使用时自动激活，有效期从激活时开始计算</p>
    </div>

    <script>
        var AUTH_TOKEN_KEY = 'radar_auth_token';
        var AUTH_EXPIRES_KEY = 'radar_auth_expires';

        function showMessage(text, type) {
            var el = document.getElementById('message');
            el.textContent = text;
            el.className = 'message ' + type;
        }

        function saveAuth(data) {
            localStorage.setItem(AUTH_TOKEN_KEY, data.token);
            localStorage.setItem(AUTH_EXPIRES_KEY, data.expires_at);
        }

        function checkExistingAuth() {
            var token = localStorage.getItem(AUTH_TOKEN_KEY);
            if (!token) return;

            fetch('api/verify.php', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.success && data.authenticated) {
                    window.location.href = 'index.html';
                }
            })
            .catch(function() {});
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var cardKey = document.getElementById('cardKey').value.trim().toUpperCase();
            var btn = document.getElementById('loginBtn');

            if (!cardKey) {
                showMessage('请输入卡密', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = '登录中...';
            showMessage('', '');

            fetch('api/login.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ card_key: cardKey })
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.success) {
                    saveAuth(data);
                    showMessage('登录成功，正在跳转...', 'success');
                    setTimeout(function() { window.location.href = 'index.html'; }, 800);
                } else {
                    showMessage(data.message || '登录失败', 'error');
                    btn.disabled = false;
                    btn.textContent = '登 录';
                }
            })
            .catch(function() {
                showMessage('网络错误，请检查服务器配置', 'error');
                btn.disabled = false;
                btn.textContent = '登 录';
            });
        });

        document.getElementById('cardKey').addEventListener('input', function() {
            this.value = this.value.toUpperCase();
        });

        checkExistingAuth();
    </script>
</body>
</html>

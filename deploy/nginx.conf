# 王者视界雷达 · Nginx 反向代理示例
# 放到 /etc/nginx/conf.d/king.conf（宝塔放 /www/server/panel/vhost/nginx/king.conf）
#
# 作用：把 80（域名）反代到 relay 的网页端口 8080。
# 注意：8888 是游戏数据端口（APP 直连），9000 段以下不要把它反代出去，
#       更不能让网页走 8888 —— 那会和 APP 的数据通道抢连接。
#
# 没备案的云服务器 80 会被厂商拦截（返回 Server: Apache + 未备案提示），
# 这种情况直接用 http://IP:8080/ 访问，不要折腾 nginx。

server {
    listen 80;
    # 有域名就填域名；没有就留 _ 表示默认站点
    server_name _;

    # 上传体积（一般用不到，留着防意外）
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # 网页订阅房间数据也走 WebSocket，所以这里要留 Upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 雷达是长连接，别让它 60 秒就断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 关掉缓冲，实时性更好
        proxy_buffering off;
    }
}
